[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ps06-cyber-triage"
version = "2.0.0"
description = "Zero-dependency AI-powered cybersecurity alert triage engine, 6-step SOC agent, and WCAG 2.1 AA accessible dashboard."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "coverage>=7.4",
    "ruff>=0.4",
    "mypy>=1.10",
]

[project.scripts]
ps06-triage = "src.server:run_server"

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v"

[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 85

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "S"]
ignore = ["S101", "S104", "S310"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
